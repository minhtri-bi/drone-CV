[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "drone-cv"
version = "0.1.0"
description = "Offline geometry and conservative depth safety experiments for drone simulation"
requires-python = ">=3.12"
dependencies = ["numpy==2.0.0"]

[project.optional-dependencies]
dev = ["pytest==8.2.2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests", "spike/freespace/tests"]
pythonpath = ["src"]
addopts = "--strict-markers"
