name: Offline core

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pinned offline dependencies
        run: python -m pip install numpy==2.0.0 pytest==8.2.2
      - name: Check project, evidence identities and portable roadmap freshness
        run: python scripts/check_project.py
      - name: Run behavioral regressions
        run: python -m pytest -q
      - name: Exercise actual offline pipeline
        run: python scripts/g0_demo.py --output artifacts/g0-ci
      - name: Exercise synthetic freespace handoff without Monte Carlo sweeps
        run: python spike/freespace/experiments.py --profile docs/replay/evidence-semantics-01/profile.json --trials 0 --output artifacts/freespace-ci
      - name: Preserve synthetic smoke artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: g0-${{ matrix.os }}
          path: artifacts/g0-ci/
          if-no-files-found: error
          retention-days: 7
      - name: Preserve synthetic freespace experiment artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: freespace-${{ matrix.os }}
          path: artifacts/freespace-ci/
          if-no-files-found: error
          retention-days: 7
